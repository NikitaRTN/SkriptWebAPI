name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and check
        run: ./gradlew clean check shadowJar --no-daemon
      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          if-no-files-found: error

  functional-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: extra-plugins
      - name: Load bundled Skript smoke test
        uses: SkriptLang/skript-test-action@v1.1
        with:
          test_script_directory: examples
          skript_repo_ref: 2.14.3
          extra_plugins_directory: extra-plugins
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    needs: [build, functional-test]
    permissions:
      contents: write
    steps:
      - name: Download tested plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.jar